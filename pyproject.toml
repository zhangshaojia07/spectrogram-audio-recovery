[project]
name = "spectrogram-audio-recovery"
version = "0.1.0"
description = "Encode audio as a spectrogram image and reconstruct it with Griffin-Lim."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Shaojia Zhang", email = "89440594+zhangshaojia07@users.noreply.github.com" },
]
keywords = [
    "audio",
    "spectrogram",
    "griffin-lim",
    "phase-retrieval",
    "signal-processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "librosa>=1.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
spectrogram-audio = "spectrogram_audio.cli:main"

[project.urls]
Homepage = "https://github.com/zhangshaojia07/spectrogram-audio-recovery"
Repository = "https://github.com/zhangshaojia07/spectrogram-audio-recovery"
Issues = "https://github.com/zhangshaojia07/spectrogram-audio-recovery/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectrogram_audio"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["spectrogram_audio"]

[tool.ruff.format]
quote-style = "double"
